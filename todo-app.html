<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    :root {
      --teal: #028090;
      --seafoam: #00a896;
      --mint: #02c39a;
      --navy: #0b2545;
      --ink: #1f2937;
      --muted: #5b6b73;
      --bg: #f4faf9;
      --card: #ffffff;
      --border: #e1ecea;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, #f4faf9 0%, #e9f5f3 100%);
      font-family: "Segoe UI", Calibri, Arial, sans-serif;
      color: var(--ink);
    }

    .todo-container {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px -20px rgba(11, 37, 69, 0.25);
    }

    .todo-header h1 {
      margin: 0 0 4px 0;
      font-size: 26px;
      font-weight: 700;
      color: var(--navy);
    }

    .subtitle {
      margin: 0 0 24px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .task-form {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    #taskInput {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #taskInput:focus {
      border-color: var(--seafoam);
      box-shadow: 0 0 0 3px rgba(0, 168, 150, 0.15);
    }

    #addTaskBtn {
      background: var(--teal);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    #addTaskBtn:hover {
      background: var(--seafoam);
    }

    #addTaskBtn:active {
      transform: scale(0.97);
    }

    .list-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      padding-bottom: 12px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    .task-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid transparent;
      animation: taskIn 0.18s ease;
    }

    @keyframes taskIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-checkbox {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border: 2px solid var(--seafoam);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .task-checkbox.checked {
      background: var(--seafoam);
      border-color: var(--seafoam);
    }

    .task-text {
      flex: 1;
      font-size: 14px;
      word-break: break-word;
      cursor: pointer;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .delete-btn:hover {
      color: #d9534f;
      background: rgba(217, 83, 79, 0.08);
    }

    .empty-state {
      display: none;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      padding: 24px 8px 4px 8px;
    }

    .todo-container.is-empty .empty-state {
      display: block;
    }

    /* Responsive: smaller screens */
    @media (max-width: 480px) {
      .todo-container {
        padding: 24px 18px;
        border-radius: 12px;
      }

      .task-form {
        flex-direction: column;
      }

      #addTaskBtn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <main class="todo-container">
    <header class="todo-header">
      <h1>To-Do List</h1>
      <p class="subtitle">A simple way to keep track of small tasks.</p>
    </header>

    <form id="taskForm" class="task-form">
      <input
        type="text"
        id="taskInput"
        placeholder="Add a new task..."
        autocomplete="off"
      />
      <button type="submit" id="addTaskBtn">Add</button>
    </form>

    <div class="list-meta">
      <span id="taskCount">0 tasks</span>
      <span id="taskCompleted">0 completed</span>
    </div>

    <ul id="taskList" class="task-list"></ul>

    <p id="emptyState" class="empty-state">
      Nothing here yet — add your first task above.
    </p>
  </main>

  <script>
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const taskCount = document.getElementById("taskCount");
    const taskCompleted = document.getElementById("taskCompleted");
    const todoContainer = document.querySelector(".todo-container");

    let tasks = [];
    let nextId = 1;

    function updateMeta() {
      const total = tasks.length;
      const completed = tasks.filter((t) => t.completed).length;
      taskCount.textContent = `${total} task${total === 1 ? "" : "s"}`;
      taskCompleted.textContent = `${completed} completed`;
      todoContainer.classList.toggle("is-empty", total === 0);
    }

    function renderTasks() {
      taskList.innerHTML = "";

      tasks.forEach((task) => {
        const li = document.createElement("li");
        li.className = "task-item" + (task.completed ? " completed" : "");
        li.dataset.id = task.id;

        const checkbox = document.createElement("span");
        checkbox.className = "task-checkbox" + (task.completed ? " checked" : "");
        checkbox.textContent = task.completed ? "\u2713" : "";
        checkbox.addEventListener("click", () => toggleTask(task.id));

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;
        text.addEventListener("click", () => toggleTask(task.id));

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.type = "button";
        deleteBtn.setAttribute("aria-label", "Delete task");
        deleteBtn.textContent = "\u2715";
        deleteBtn.addEventListener("click", () => deleteTask(task.id));

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(deleteBtn);
        taskList.appendChild(li);
      });

      updateMeta();
    }

    function addTask(text) {
      tasks.push({ id: nextId++, text, completed: false });
      renderTasks();
    }

    function toggleTask(id) {
      const task = tasks.find((t) => t.id === id);
      if (task) {
        task.completed = !task.completed;
        renderTasks();
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter((t) => t.id !== id);
      renderTasks();
    }

    taskForm.addEventListener("submit", function (e) {
      e.preventDefault();
      const value = taskInput.value.trim();
      if (value === "") return;
      addTask(value);
      taskInput.value = "";
      taskInput.focus();
    });

    // Start with the empty state visible
    renderTasks();
  </script>
</body>
</html>
